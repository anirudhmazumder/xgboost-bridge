name: Platform probe

# Every number in VERIFICATION.md was measured on darwin/arm64. This workflow is
# the only way this repository can obtain a measurement on anything else, and the
# project's whole method is measurement rather than argument -- so it is a
# permanent, manually-dispatched job rather than a throwaway.
#
# It runs a probe script from probes/ unchanged and prints bit patterns. Diff its
# output against the same script's output on another platform; that diff is the
# finding. It asserts nothing and cannot fail the build, which is deliberate: a
# probe that enforces an expectation cannot report a surprise.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Probe script under probes/ to run"
        required: true
        default: platform_log_probe.py
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Run a probe on linux/x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync

      # Two separate properties, because an earlier version of this comment
      # claimed the second while implementing only the first:
      #
      #   1. The input reaches the shell through `env:` and is always quoted, so
      #      it never becomes command text. Metacharacters and newlines are
      #      inert. That was true before and is still true.
      #   2. The name is checked against the actual directory listing. It was
      #      not: `[ -f "probes/$X" ]` accepts `../`, so the input selected any
      #      file the path resolved to. It granted no privilege -- dispatch
      #      already requires write access, and this job has `contents: read`,
      #      no secret and no environment -- but the comment asserting a
      #      validation that did not exist is what would stop the next reader
      #      from checking.
      - name: Run the probe
        env:
          PROBE_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          available=$(cd probes && ls *.py)
          matched=""
          for candidate in $available; do
            if [ "$candidate" = "$PROBE_SCRIPT" ]; then
              matched="$candidate"
            fi
          done
          if [ -z "$matched" ]; then
            echo "No such probe script: $PROBE_SCRIPT"
            echo "Available:"
            echo "$available"
            exit 1
          fi
          uv run python "probes/$matched"
