name: CI

# Test-only workflow. There is no publish/release job here at all — nothing in
# this file can push a package anywhere. See COMPAT.md and docs/DECISIONS.md for
# the compatibility and release policy, and .github/workflows/release.yml
# (configured, never executed) for the release mechanics.
# Sequence form, deliberately. The original block used bare null-valued event
# keys and produced zero runs AND zero check-suites on push -- never dispatched,
# rather than dispatched and failed. Rewriting it with explicit `branches: ["**"]`
# filters did not fix it either. This form is the canonical spelling from
# GitHub's own documentation and has neither a null mapping nor a glob to be
# ambiguous about, so it removes both variables at once. Firing on every branch
# is what is wanted here regardless.
#
# workflow_dispatch stays: it is the manual escape hatch, and it is what proved
# Actions itself works on this repository when push triggering did not.
on: [push, pull_request, workflow_dispatch]

# Least privilege: nothing here needs to write to the repository. Stated rather
# than inherited, so a later job cannot quietly gain more.
permissions:
  contents: read

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `uv run pytest` now collects packages/python/tests/test_parity.py,
      # which compares this repository's two predictors against each other
      # over the whole fixture corpus. That harness shells out to `node` and
      # requires a built `packages/js/dist/` newer than `packages/js/src/`
      # (parity/run_parity.py's freshness check) -- it refuses to measure
      # parity against a stale bundle rather than silently doing so. Building
      # here, before the Python job ever runs, is what satisfies that
      # freshness check: the checkout above writes packages/js/src/*.ts, and
      # only afterward does `npm run build` write packages/js/dist/, so the
      # bundle's mtime is always the later one.
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install JavaScript dependencies
        working-directory: packages/js
        run: npm ci --ignore-scripts

      - name: Build the JavaScript bundle (required by the parity harness)
        working-directory: packages/js
        run: npm run build

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      # Workspace members: packages/python and fixtures. Syncing the fixtures
      # member pulls in xgboost==3.3.0, which fixtures/tests/ and the
      # generator both need -- fixtures/tests/ is one of pytest's two
      # testpaths (see pyproject.toml) and runs as part of the step below,
      # not as a separate job.
      - name: Sync workspace (packages/python, fixtures)
        run: uv sync

      # Collects packages/python/tests/ and fixtures/tests/ both (see
      # pyproject.toml's testpaths): the ordinary unit suite, the JSON Schema
      # checks against schema/, the fixture-corpus comparison against
      # XGBoost's own recorded predict() output, and the cross-language
      # parity harness set up above -- one command, no separate job per
      # check, because pytest's own collection is already the wiring for all
      # of them.
      - name: Run Python test suite
        run: uv run pytest

      # Redundant as a *check* -- test_parity.py already asserts both mismatch
      # lists are empty, and the job fails above if they are not. It is here for
      # its output: pytest captures stdout, so a passing suite reports the two
      # parity numbers nowhere, and "parity is 0.0 on this platform" was a claim
      # with no visible measurement behind it in any log. This prints the table.
      - name: Cross-language parity, both measurement points
        run: uv run python parity/run_parity.py

      # The 299-row corpus is small enough that a defect reachable only from a
      # specific feature value could sit inside it: measured, reverting the
      # sample-side float32 cast in the JavaScript walk produces ONE corpus
      # mismatch and 1279 of 20000 here. This runs the same comparator over
      # ~100,000 generated rows, most of which land exactly on a real threshold
      # or on a float64 value that narrows onto one.
      #
      # It also self-checks: a one-ULP injection at each measurement point must
      # produce exactly one mismatch, because "0 over 100,000 rows" is also what
      # a silently broken comparison reports.
      - name: Cross-language parity at scale (~100,000 adversarial rows)
        run: uv run python parity/run_parity_scale.py

  javascript:
    name: JavaScript suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Zero JS runtime dependencies is non-negotiable (D009). Assert it
      # numerically rather than assuming package.json was never edited.
      #
      # Every field that can put code in a consumer's tree, not just
      # `dependencies` -- counting that one alone let a `peerDependencies` or
      # `optionalDependencies` entry through a check whose comment claimed to
      # guard against package.json being edited at all.
      # packages/js/test/bundle.test.js covers the same ground and additionally
      # scans dist/ for import/require; this is the cheap early signal.
      - name: Assert zero JS runtime dependencies
        run: |
          COUNT=$(node -p "['dependencies','peerDependencies','optionalDependencies','bundledDependencies','bundleDependencies'].reduce((n,k)=>n+Object.keys(require('./package.json')[k]||{}).length,0)")
          echo "Runtime dependency count, every install-time field: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "FAIL: expected 0 runtime dependencies, found $COUNT"
            exit 1
          fi

      # Separate step from the build, per D011.
      - name: Type-check
        run: npm run typecheck

      - name: Build (bundle to dist/)
        run: npm run build

      # Runs against the built dist/ output, not src/ (D011). The build step
      # above already produced dist/, so this deliberately does not re-run it.
      - name: Run JavaScript test suite
        run: npm run test:nobuild

  # ---------------------------------------------------------------------------
  # Clean-install jobs.
  #
  # Every other check in this repository runs against the source tree through the
  # uv workspace or against packages/js/dist by relative path. Neither exercises
  # the PACKAGE a user receives. A module that imports only because src/ is on
  # the path, a file that never ships, an export-map condition pointing at
  # nothing, a dependency that is really required but declared optional -- all of
  # those pass the entire suite and fail on install. Two shipped: the export
  # extra resolved an XGBoost version the exporter then refused, and the npm
  # tarball carried no README or LICENCE.
  #
  # These are permanent jobs, not one-off checks, because a clean-install check
  # that ran once is one that will silently rot. Both invoke the same scripts a
  # developer runs locally, so CI cannot drift from what is reproducible by hand.
  # ---------------------------------------------------------------------------
  python-clean-install:
    name: Python clean install (wheel contents, then install and predict)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      # Builds the wheel and sdist, asserts every runtime module and the licence
      # are inside, installs into an environment containing nothing else, then
      # imports and predicts from OUTSIDE the repository -- and separately
      # installs the export extra and round-trips a real model.
      - name: Build, verify contents, install, and predict
        run: ./tools/clean_install_python.sh

  js-clean-install:
    name: JavaScript clean install (tarball contents, then install and predict)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Packs the tarball, asserts every promised file is inside and that the
      # export map resolves entirely within it, installs into an empty project,
      # then predicts through BOTH the ESM and the CommonJS entry points and
      # compiles a require()-mode TypeScript consumer against the package.
      - name: Pack, verify contents, install, and predict
        run: ./tools/clean_install_js.sh
