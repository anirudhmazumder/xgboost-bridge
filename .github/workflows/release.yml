name: Release

# CONFIGURED, NEVER EXECUTED. This file exists so the release mechanics are
# reviewable before either package is ever published -- not because
# publishing is imminent. No step below has been run. See COMPAT.md ("What
# this document does not yet cover") and docs/DECISIONS.md D012 for what is and
# is not decided about a 1.0 announcement.
#
# Three independent things must all be true before this workflow could
# publish anything, and only the first is expressed in GitHub Actions syntax
# below; the other two are facts about the world as of this writing, recorded
# here so a future reader does not have to rediscover them:
#
#   1. Trigger is `workflow_dispatch` only -- no `push`, no tag trigger, no
#      `release` event anywhere in this file. Nothing in ordinary repository
#      activity (a commit, a merge, a tag, a GitHub Release) can start this
#      workflow; it requires a human to open the Actions tab and click
#      "Run workflow" deliberately.
#   2. Both publish jobs are gated on the `release` GitHub Environment
#      (`environment: release` below). No such environment has been created
#      in this repository's settings as of this writing. Creating one, and
#      attaching a required-reviewer protection rule to it, is a
#      repository-settings change -- this file cannot make that change and
#      does not make it. Referencing an environment name that does not exist
#      is not by itself a guarantee that GitHub will block the run; the
#      protection comes from the reviewer rule that has not been configured,
#      and that is a deliberate, separate, human action.
#   3. Neither publish step has working credentials yet, because neither
#      package has ever been published under either name: there is no PyPI
#      Trusted Publisher entry naming this repository and workflow for
#      `xgboost-bridge`, and there is no `NPM_TOKEN` secret in this
#      repository for `xgboost-predictor`. Even a manually dispatched run of
#      this workflow would fail authentication on both publish steps today.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "publish" to confirm intent. Documentary only -- no step below
          reads this input's value; it exists so the manual dispatch form
          itself states what is about to happen.
        required: true
        type: string

# Least privilege, stated rather than inherited. Once any scope is named,
# every unnamed scope becomes `none` -- so a job declaring only
# `id-token: write` gets `contents: none` and its `actions/checkout` cannot
# read the repository. Both publish jobs had exactly that shape, which would
# have failed on the first-ever run.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Why the work and the credentials are in different jobs
#
# The earlier version ran `npm ci`, `uv sync`, the suites and two build scripts
# inside the same jobs that held `id-token: write` and `NODE_AUTH_TOKEN`. The
# OIDC request variables and the npm token are present for a job's whole
# duration, so running the gate first constrains nothing: a dependency
# executing an install script could mint a publishing token before any test
# ran. Ordering is not a control when the credential does not depend on it.
#
# `verify` therefore holds no credential and cannot publish. The two publish
# jobs hold a credential and do nothing but download an artifact and upload it.
# ---------------------------------------------------------------------------
jobs:
  verify:
    name: Full gate, then build both distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read # deliberately no id-token: this job must not be able to publish
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # --ignore-scripts: the one dependency here with an install script is
      # esbuild, whose binary arrives from a locked, hashed platform package, so
      # the script has nothing left to do.
      - name: Install JavaScript dependencies
        working-directory: packages/js
        run: npm ci --ignore-scripts

      - name: Type-check (separate from the build, per D011)
        working-directory: packages/js
        run: npm run typecheck

      - name: Build the JavaScript bundle
        working-directory: packages/js
        run: npm run build

      - name: Run JavaScript test suite against the built bundle
        working-directory: packages/js
        run: npm run test:nobuild

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync

      - name: Run Python test suite
        run: uv run pytest

      - name: Cross-language parity, both measurement points
        run: uv run python parity/run_parity.py

      - name: Cross-language parity at scale (~100,000 adversarial rows)
        run: uv run python parity/run_parity_scale.py

      - name: Verify the wheel's contents, then install and predict
        run: ./tools/clean_install_python.sh

      - name: Verify the tarball's contents, then install and predict
        run: ./tools/clean_install_js.sh

      - name: Build the Python distributions
        run: uv build packages/python --out-dir dist

      # Packed here rather than in the credentialed job, so that job needs no
      # node_modules and runs no install script.
      #
      # Order-dependent, deliberately: `--pack-destination` into a directory that
      # does not exist fails with ENOENT, and `uv build --out-dir dist` above is
      # what creates it. Do not move this step earlier.
      - name: Pack the npm tarball
        working-directory: packages/js
        run: npm pack --pack-destination ../../dist

      # Read from the installed package, not from the manifest: `pyproject.toml`
      # declares `dynamic = ["version"]` and carries no literal `version =`
      # (D057), so ['project']['version'] KeyErrors -- which is what an earlier
      # form of this step did, and it would have failed the first ever run after
      # the whole gate had passed.
      - name: Show exactly what would be published
        run: |
          set -euo pipefail
          ls -l dist
          echo "--- versions being spent, permanently ---"
          echo "python: $(uv run python -c 'import xgboost_bridge; print(xgboost_bridge.__version__)')"
          node -p "'npm:    ' + require('./packages/js/package.json').version"

      - name: Hand the distributions to the publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-python:
    name: Publish xgboost-bridge to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # No environment named "release" exists in this repository yet -- see the
    # file header. Until it is created with a required-reviewer rule, this name
    # is a label, not a lock.
    environment: release
    permissions:
      contents: read
      # Required for PyPI trusted publishing (OIDC). No PyPI API token is, or
      # should ever be, stored in this repository.
      id-token: write
    steps:
      - name: Collect the distributions built by the verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # The npm tarball travels in the same artifact; the publisher must not see
      # it, so it is removed before the upload rather than after.
      - name: Keep only the Python distributions
        run: rm -f dist/*.tgz && ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  publish-javascript:
    name: Publish xgboost-predictor to npm
    # Ordered after the PyPI upload deliberately. Both are irreversible, so if
    # one must fail it should be the second: a published Python package with no
    # npm counterpart is a gap, whereas the reverse plus a failed retry leaves
    # the two registries disagreeing about what 1.0 is.
    needs: [verify, publish-python]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required alongside NODE_AUTH_TOKEN for `npm publish --provenance`.
      #
      # npm now supports Trusted Publishing, which would remove NODE_AUTH_TOKEN
      # entirely and make this symmetric with the PyPI side above. Configuring it
      # is an npm-account change, so it is recorded here rather than assumed.
      id-token: write
    steps:
      - name: Set up Node.js 20 with the npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Collect the tarball packed by the verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # `--tag` is not cosmetic. npm bundled with Node 20 is 10.8.2, which has no
      # prerelease guard: `npm publish` of 1.0.0-rc.1 with no tag publishes to
      # `latest`, so `npm i xgboost-predictor` would install a release candidate.
      # npm 11 throws "You must specify a tag using --tag when publishing a
      # prerelease version" -- so the mistake is loud on the npm we will not get
      # and silent on the one we will. PyPI needs no equivalent: `1.0.0rc1` is a
      # PEP 440 prerelease and pip declines to select it by default. The
      # asymmetry was the bug.
      #
      # `publishConfig.tag` in package.json says the same thing, so both npm
      # versions behave identically whether or not this flag is passed.
      - name: Publish the packed tarball
        run: |
          set -euo pipefail
          TARBALL=$(ls dist/*.tgz)
          echo "publishing $TARBALL"
          npm publish "$TARBALL" --access public --provenance --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
