name: Release

# The release workflow. It HAS now executed, against npm only, and the record of
# what that first execution found is below -- an earlier version of this header
# said "CONFIGURED, NEVER EXECUTED" and listed three reasons nothing could
# publish, all of which have since changed.
#
# What is true as of 2026-08-07:
#
#   1. Trigger is `workflow_dispatch` only -- no `push`, no tag trigger, no
#      `release` event anywhere in this file. Nothing in ordinary repository
#      activity can start it; it requires a human to dispatch it deliberately.
#   2. Both publish jobs are gated on the `release` GitHub Environment, which
#      EXISTS and carries a `required_reviewers` protection rule. Measured:
#        gh api repos/anirudhmazumder/xgboost-bridge/environments
#          -> release: protection_rules=required_reviewers
#      That matters because GitHub creates an environment on first reference with
#      no protection rules, so the name alone guarantees nothing.
#   3. npm Trusted Publishing IS configured (anirudhmazumder / xgboost-bridge /
#      release.yml / release), so `publish-javascript` needs no secret -- there is
#      no npm token in this repository. PyPI Trusted Publishing is NOT yet
#      configured, and `xgboost-bridge` does not exist on pypi.org, which is why
#      the `targets` input exists.
#
# Two failures from the first two dispatches, both in this file rather than in
# the configuration, and both recorded because their error messages named the
# wrong thing:
#
#   * `npm publish dist/x.tgz` published nothing. npm parses a bare `a/b` spec as
#     the GitHub shorthand `github:a/b`, so it ran `git ls-remote` and reported
#     "Permission denied (publickey)" -- SSH keys, from a step that touches no
#     git. The path is absolute now.
#   * `setup-node` with `registry-url` wrote an .npmrc containing its own
#     placeholder token, `XXXXX-XXXXX-XXXXX-XXXXX`. npm sent that instead of
#     performing the OIDC exchange and the registry answered `E404 Not Found`,
#     because npm returns 404 rather than 403 for authorization failures.
#     Provenance had already been signed and logged to sigstore by then, since
#     signing needs no registry auth -- so the failure looked like a publish
#     problem rather than an auth one. `registry-url` is gone, and the publish
#     step now asserts that no credential is configured before it runs.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "publish" to confirm intent. Documentary only -- no step below
          reads this input's value; it exists so the manual dispatch form
          itself states what is about to happen.
        required: true
        type: string
      targets:
        description: >-
          Which registries to publish to.

          `both` is the release path. `npm-only` exists because npm requires a
          package to exist before Trusted Publishing can be configured, so the
          first npm publish is manual and the workflow's npm path needs a
          rehearsal that does not also require a PyPI Trusted Publisher. `none`
          runs the full gate and publishes nothing -- a dry run of everything
          except the irreversible part, which is also how to leave a green run in
          the history without spending a version.

          A non-prerelease version MUST use `both` or `none` -- asserted in
          `verify`, because half-publishing a real release is the failure this
          input could otherwise cause.
        required: true
        default: both
        type: choice
        options:
          - both
          - npm-only
          - pypi-only
          - none
      allow_partial:
        description: >-
          Permit a non-prerelease to target ONE registry. Leave false for a
          release. Its only legitimate use is completing a split: if `both` ships
          one registry and then fails on the other, 1.0.0 is already spent there
          and a re-dispatch would fail on the duplicate before reaching the one
          that still needs publishing. Without this, recovering from that state
          would mean editing this workflow under pressure, immediately after a
          partial release -- which is the worst possible moment to be editing it.
        required: true
        default: false
        type: boolean

# Least privilege, stated rather than inherited. Once any scope is named,
# every unnamed scope becomes `none` -- so a job declaring only
# `id-token: write` gets `contents: none` and its `actions/checkout` cannot
# read the repository. Both publish jobs had exactly that shape, which would
# have failed on the first-ever run.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Why the work and the credentials are in different jobs
#
# The earlier version ran `npm ci`, `uv sync`, the suites and two build scripts
# inside the same jobs that held `id-token: write` and `NODE_AUTH_TOKEN`. The
# OIDC request variables and the npm token are present for a job's whole
# duration, so running the gate first constrains nothing: a dependency
# executing an install script could mint a publishing token before any test
# ran. Ordering is not a control when the credential does not depend on it.
#
# `verify` therefore holds no credential and cannot publish. The two publish
# jobs hold a credential and do nothing but download an artifact and upload it.
# ---------------------------------------------------------------------------
jobs:
  verify:
    name: Full gate, then build both distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read # deliberately no id-token: this job must not be able to publish
    outputs:
      # Read once, here, from the installed package and the manifest -- so the
      # publish jobs pin what was built rather than re-deriving it.
      version: ${{ steps.built.outputs.version }}
      npm_version: ${{ steps.built.outputs.npm_version }}
      npm_tag: ${{ steps.built.outputs.npm_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # --ignore-scripts: the one dependency here with an install script is
      # esbuild, whose binary arrives from a locked, hashed platform package, so
      # the script has nothing left to do.
      - name: Install JavaScript dependencies
        working-directory: packages/js
        run: npm ci --ignore-scripts

      - name: Type-check (separate from the build, per D011)
        working-directory: packages/js
        run: npm run typecheck

      - name: Build the JavaScript bundle
        working-directory: packages/js
        run: npm run build

      - name: Run JavaScript test suite against the built bundle
        working-directory: packages/js
        run: npm run test:nobuild

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync

      - name: Run Python test suite
        run: uv run pytest

      - name: Cross-language parity, both measurement points
        run: uv run python parity/run_parity.py

      - name: Cross-language parity at scale (~100,000 adversarial rows)
        run: uv run python parity/run_parity_scale.py

      - name: Verify the wheel's contents, then install and predict
        run: ./tools/clean_install_python.sh

      - name: Verify the tarball's contents, then install and predict
        run: ./tools/clean_install_js.sh

      - name: Build the Python distributions
        run: uv build packages/python --out-dir dist

      # Packed here rather than in the credentialed job, so that job needs no
      # node_modules and runs no install script.
      #
      # Order-dependent, deliberately: `--pack-destination` into a directory that
      # does not exist fails with ENOENT, and `uv build --out-dir dist` above is
      # what creates it. Do not move this step earlier.
      - name: Pack the npm tarball
        working-directory: packages/js
        run: npm pack --pack-destination ../../dist

      # Read from the installed package, not from the manifest: `pyproject.toml`
      # declares `dynamic = ["version"]` and carries no literal `version =`
      # (D057), so ['project']['version'] KeyErrors -- which is what an earlier
      # form of this step did, and it would have failed the first ever run after
      # the whole gate had passed.
      - name: Show exactly what would be published
        id: built
        run: |
          set -euo pipefail
          ls -l dist
          VERSION=$(uv run python -c "import xgboost_bridge; print(xgboost_bridge.__version__)")
          NPM_VERSION=$(node -p "require('./packages/js/package.json').version")
          echo "--- versions being spent, permanently ---"
          echo "python: $VERSION"
          echo "npm:    $NPM_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

          # The dist-tag is decided HERE, not in the publish job. That job has no
          # checkout -- by design, it downloads an artifact and calls the publisher
          # and nothing else -- so it cannot reach tools/check_dist_tags.mjs. An
          # earlier version of this computed the tag there anyway and would have
          # failed on a missing module: the same class of mistake as the three
          # hardcoded assumptions, made while fixing them.
          #
          # It also means the credentialed job computes nothing at all, which is
          # the shape the trust-domain split is for.
          if node -e '
            import("./tools/check_dist_tags.mjs").then((m) => {
              process.exit(m.isPrerelease(process.argv[1]) ? 0 : 1);
            });
          ' "$NPM_VERSION"; then
            NPM_TAG=rc
          else
            NPM_TAG=latest
          fi
          echo "npm dist-tag: $NPM_TAG"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      # A prerelease may target one registry; a final release may not. Without
      # this, `npm-only` on 1.0.0 would put the JavaScript package on npm with no
      # Python counterpart and nothing would say so until someone noticed.
      - name: A non-prerelease must publish to both registries
        run: |
          set -euo pipefail
          VERSION="${{ steps.built.outputs.version }}"
          NPM_VERSION="${{ steps.built.outputs.npm_version }}"
          echo "python $VERSION, npm $NPM_VERSION, targets ${{ inputs.targets }}"
          # From the tested module, not a regex inlined here. This was the third
          # definition of "prerelease" in this pipeline and the loosest: it matched
          # any version *containing* `a` or `b`. Safe for digits-and-dots releases
          # and the wrong shape -- a mis-classification lets a final release
          # publish to one registry only, because the guard would treat it as a
          # prerelease and skip the both-registries requirement.
          IS_PRERELEASE=$(node -e '
            import("./tools/check_dist_tags.mjs").then((m) => {
              process.stdout.write(m.isPrereleasePep440(process.argv[1]) ? "yes" : "no");
            });
          ' "$VERSION")
          echo "prerelease: $IS_PRERELEASE"
          # `none` publishes nothing, so the both-registries requirement does not
          # apply to it -- refusing it would make the dry run unusable on exactly
          # the versions it is most worth rehearsing.
          if [ "$IS_PRERELEASE" = "no" ] \
            && [ "${{ inputs.targets }}" != "both" ] \
            && [ "${{ inputs.targets }}" != "none" ]; then
            if [ "${{ inputs.allow_partial }}" != "true" ]; then
              echo "FAIL: $VERSION is not a prerelease, so targets must be 'both'"
              echo "  (set allow_partial=true only to complete a split release)"
              exit 1
            fi
            echo "WARNING: publishing a non-prerelease to ${{ inputs.targets }} only."
            echo "  This is legitimate ONLY to complete a split release."
          fi

      - name: Hand the distributions to the publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-python:
    name: Publish xgboost-bridge to PyPI
    needs: verify
    # An ALLOW-list. The condition was `!= 'npm-only'`, which fails OPEN: any
    # value other than that one publishes, so adding a new option -- `none`, or
    # anything later -- would have silently published to PyPI by default. Naming
    # the values that publish means an unrecognised input publishes nothing.
    if: inputs.targets == 'both' || inputs.targets == 'pypi-only'
    runs-on: ubuntu-latest
    # No environment named "release" exists in this repository yet -- see the
    # file header. Until it is created with a required-reviewer rule, this name
    # is a label, not a lock.
    environment: release
    permissions:
      contents: read
      # Required for PyPI trusted publishing (OIDC). No PyPI API token is, or
      # should ever be, stored in this repository.
      id-token: write
    steps:
      - name: Collect the distributions built by the verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # The npm tarball travels in the same artifact; the publisher must not see
      # it, so it is removed before the upload rather than after.
      - name: Keep only the Python distributions
        run: rm -f dist/*.tgz && ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  publish-javascript:
    name: Publish xgboost-predictor to npm
    # Ordered after the PyPI upload deliberately. Both are irreversible, so if
    # one must fail it should be the second: a published Python package with no
    # npm counterpart is a gap, whereas the reverse plus a failed retry leaves
    # the two registries disagreeing about what 1.0 is.
    needs: [verify, publish-python]
    # `publish-python` being SKIPPED must not skip this job, which is what a bare
    # `needs` would do. So the condition is explicit: verify must have succeeded,
    # and the PyPI job must have either succeeded or been deliberately skipped --
    # never failed.
    if: >-
      !cancelled()
      && (inputs.targets == 'both' || inputs.targets == 'npm-only')
      && needs.verify.result == 'success'
      && (needs.publish-python.result == 'success'
          || needs.publish-python.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) and for `--provenance`. No npm
      # token exists in this repository, so this permission is the whole of the
      # credential -- same shape as the PyPI job above.
      id-token: write
    steps:
      # Node 24 in THIS job only, and deliberately not in `verify`. npm's trusted
      # publishing requires npm >= 11.5.1 AND Node >= 22.14.0, and Node 20 bundles
      # npm 10.8.2 -- so upgrading npm in place on Node 20, which an earlier form
      # of this job did, satisfies one requirement and not the other.
      #
      # Changing the Node used for the BUILD to change a publish mechanism would
      # be the wrong trade, and it is unnecessary: this job builds nothing. It
      # uploads a tarball that `verify` already packed under Node 20, so the
      # artifact is unaffected by the version here.
      # NO `registry-url`. That option is for token auth: setup-node writes an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and points NPM_CONFIG_USERCONFIG at it -- and when no token is supplied it
      # substitutes its own placeholder literal, `XXXXX-XXXXX-XXXXX-XXXXX`.
      #
      # Measured on the second dispatch of this workflow: npm found that bogus
      # credential, sent it instead of performing the OIDC exchange, and the
      # registry answered `E404 Not Found - PUT .../xgboost-predictor`. npm returns
      # 404 rather than 403 for an authorization failure, so the message names the
      # package and says nothing about credentials. Provenance had already been
      # signed and logged to sigstore by then, because signing needs no registry
      # auth -- which made the failure look like a publish problem rather than an
      # auth one.
      #
      # Trusted Publishing needs npm to find NO credential, so it falls through to
      # the OIDC exchange. registry.npmjs.org is the default registry, so nothing
      # is lost by omitting it.
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Collect the tarball packed by the verify job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # Trusted Publishing, so there is no npm token in this repository at all --
      # symmetric with the PyPI side, which has never had one. It requires npm
      # >= 11.5.1, and Node 20 bundles 10.8.2, so the CLI is upgraded in place
      # rather than by moving to a newer Node: the *build* was done in `verify`
      # under Node 20, and this job only uploads a tarball it already has.
      #
      # `--tag` is not cosmetic. npm 10.8.2 has no prerelease guard, so
      # `npm publish` of 1.0.0-rc.1 with no tag publishes to `latest` and
      # `npm i xgboost-predictor` would install a release candidate. npm 11
      # throws instead -- loud on the npm we now use, silent on the one we did.
      # `publishConfig.tag` does NOT cover for it, which I checked rather than
      # assumed and had previously claimed the opposite of. Probed on npm 12.0.1
      # with a throwaway manifest: `publishConfig.registry` IS applied -- a
      # sentinel registry shows up in the publish target -- while
      # `publishConfig.tag: "rc"` still reports `with tag latest`. So the manifest
      # field is not a second line of defence here, and **this flag is the only
      # thing keeping a release candidate off the `latest` dist-tag.** A future
      # edit removing it as redundant would publish an RC as `latest`, which is
      # what `npm i xgboost-predictor` resolves to. Pinned by a test.
      #
      # PyPI needs no equivalent: `1.0.0rc1` is a PEP 440 prerelease and pip
      # declines to select it by default.
      # Asserted rather than assumed. Node 24 bundles npm 11.x today; if a runner
      # image ever regresses that, this fails with the actual versions instead of
      # letting the registry return a token-shaped error, which is the confusing
      # failure. Both floors are npm's documented requirements for trusted
      # publishing: npm >= 11.5.1 AND Node >= 22.14.0 -- so upgrading npm in place
      # on Node 20, which an earlier form of this job did, satisfies one and not
      # the other.
      #
      # The comparison is exercised locally before landing, on v20.19.0/v24.7.0 and
      # npm 10.8.2/11.5.1/11.6.0, because `return` at the top level of `node
      # --eval` is a syntax error and the first version of this used one.
      - name: Require versions that support Trusted Publishing
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          CHECK='
            const cmp = (a, b) => {
              const x = a.split(".").map(Number);
              const y = b.split(".").map(Number);
              for (let i = 0; i < 3; i += 1) {
                const l = x[i] ?? 0;
                const r = y[i] ?? 0;
                if (l !== r) return l - r;
              }
              return 0;
            };
            const need = process.argv[1];
            const got = process.argv[2].replace(/^v/, "");
            const label = process.argv[3];
            if (cmp(got, need) < 0) {
              throw new Error(label + " " + got + " is below the required " + need);
            }
            console.log(label + " " + got + " satisfies >= " + need);
          '
          node --eval "$CHECK" 22.14.0 "$(node --version)" node
          node --eval "$CHECK" 11.5.1 "$(npm --version)" npm

      - name: Publish the packed tarball
        run: |
          set -euo pipefail
          # An ABSOLUTE path, and this is not fussiness. `npm publish dist/x.tgz`
          # does not publish a file: npm parses a bare `a/b` spec as the GitHub
          # shorthand `github:a/b`, so the first dispatch of this workflow ran
          #   git ls-remote ssh://git@github.com/dist/xgboost-predictor-1.0.0-rc.2.tgz.git
          # and died with "Permission denied (publickey)" -- an error naming SSH
          # keys, from a step that touches no git. Reproduced locally:
          # `dist/x.tgz` gives `Refusing to fetch "github:dist/x.tgz"`, while
          # `./dist/x.tgz` and an absolute path both resolve to the file.
          TARBALL="$(cd dist && pwd)/$(ls dist | grep '\.tgz$')"
          if [ ! -f "$TARBALL" ]; then
            echo "FAIL: $TARBALL is not a regular file"
            ls -l dist
            exit 1
          fi
          # No credential must be configured, or npm sends it instead of doing the
          # OIDC exchange. This is the check that would have named the previous
          # failure immediately.
          # Require a CONFIRMED ABSENCE, not the absence of a confirmed presence.
          # This read `| grep -qv '^undefined$'`, which fails only when it
          # positively observes a token -- so a config read that errored (stderr
          # was swallowed) or printed nothing satisfied it, and the publish would
          # proceed with whatever credential was actually configured, defeating
          # the OIDC exchange this check exists to protect. Same failure direction
          # as the deny-list job conditions: the guard failing toward the state it
          # exists to prevent.
          #
          # Fail-closed means npm changing its unset sentinel would cause a
          # spurious release failure. That is the correct trade for something
          # gating a credential, and it is a one-line fix; the other direction
          # publishes with a stale token and says nothing.
          TOKEN_CONFIG="$(npm config get //registry.npmjs.org/:_authToken 2>&1 || true)"
          if [ "$TOKEN_CONFIG" != "undefined" ]; then
            echo "FAIL: expected no npm auth token to be configured."
            echo "  Trusted Publishing requires npm to find NO credential, so that it"
            echo "  performs the OIDC exchange instead of sending one."
            echo "  npm config get //registry.npmjs.org/:_authToken -> ${TOKEN_CONFIG:-<empty>}"
            echo "  (expected the literal string 'undefined')"
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "FAIL: NODE_AUTH_TOKEN is set; Trusted Publishing requires it unset"
            exit 1
          fi
          echo "no npm credential configured -- OIDC exchange will be used"

          # The tag comes from `verify`, which has the checkout that the tested
          # predicate needs. This job derives nothing.
          VERSION="${{ needs.verify.outputs.npm_version }}"
          TAG="${{ needs.verify.outputs.npm_tag }}"
          if [ -z "$TAG" ]; then
            echo "FAIL: the verify job exported no dist-tag"
            exit 1
          fi

          echo "publishing $TARBALL as $VERSION under dist-tag $TAG"
          # No NODE_AUTH_TOKEN. npm exchanges the Actions OIDC token for a
          # short-lived credential, which is why `id-token: write` is declared on
          # this job and why the job runs nothing else.
          npm publish "$TARBALL" --access public --provenance --tag "$TAG"

      # The tag that was actually passed, handed to the verification job below.
      # A job output rather than a re-derivation, so the check cannot disagree with
      # the publish about what it did.

  # ---------------------------------------------------------------------------
  # What the dist-tags actually point at, after the upload. `npm install <pkg>`
  # resolves `latest`, so a prerelease sitting there is a silent
  # wrong-version-installed path.
  #
  # A SEPARATE JOB, with no id-token and no credential. It needs a checkout to run
  # the script, and the publish job deliberately has none -- its whole design is
  # "download an artifact and call the publisher, and nothing else", so widening it
  # to fetch the repository would undo the trust-domain split for the sake of a
  # verification step that requires no authority at all.
  #
  # The logic lives in tools/check_dist_tags.mjs, not inline, and that is the fix
  # for a shape rather than for a bug. The inline version hardcoded `rc` -- correct
  # while every publish was a release candidate -- so on the 1.0.0 release it waited
  # six times for `rc` to become `1.0.0`, which could not happen, then reported a
  # timeout about a release that had already succeeded. The tag *derivation* had a
  # test and was caught before any dispatch; the *check on the tag* had none,
  # because one was in a file a test could import and the other was inline YAML.
  #
  # It is unit-tested offline against recorded registry responses -- including the
  # state that existed when this failed, and including the old rule, which the
  # suite runs against that same input and requires to disagree.
  # ---------------------------------------------------------------------------
  verify-dist-tags:
    name: Assert the npm dist-tags point where they should
    needs: [verify, publish-javascript]
    # Nothing published means nothing to verify. Without this the job would be
    # skipped anyway by its `needs`, but stating it keeps the reason legible.
    if: inputs.targets == 'both' || inputs.targets == 'npm-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read # no id-token: this job verifies, it cannot publish
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Check the dist-tags
        env:
          PACKAGE_NAME: xgboost-predictor
        run: |
          set -euo pipefail
          node tools/check_dist_tags.mjs \
            "${{ needs.verify.outputs.npm_version }}" \
            "${{ needs.verify.outputs.npm_tag }}"
