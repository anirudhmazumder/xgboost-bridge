[project]
name = "xgboost-bridge"
version = "0.1.0.dev0"
description = "Export trained XGBoost models as portable JSON artifacts, with a reference predictor."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Name only, no address. A PyPI release is permanent per version, and an email
# published there cannot be withdrawn from the index or from its mirrors.
authors = [{ name = "Anirudh Mazumder" }]
keywords = ["xgboost", "inference", "json", "gradient-boosting", "float32"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

# Without these the PyPI page carries no link back to the source, and a reader
# has no route to FORMAT.md, the compatibility policy, or the evidence.
[project.urls]
Homepage = "https://github.com/anirudhmazumder/xgboost-bridge"
Repository = "https://github.com/anirudhmazumder/xgboost-bridge"
Issues = "https://github.com/anirudhmazumder/xgboost-bridge/issues"
"Artifact format" = "https://github.com/anirudhmazumder/xgboost-bridge/blob/main/FORMAT.md"
"Compatibility policy" = "https://github.com/anirudhmazumder/xgboost-bridge/blob/main/COMPAT.md"
"Verification" = "https://github.com/anirudhmazumder/xgboost-bridge/blob/main/VERIFICATION.md"

[project.optional-dependencies]
# Reading a fitted model requires XGBoost. Prediction and artifact inspection do not.
export = ["xgboost==3.3.0"]

[build-system]
# Pinned. This backend builds the wheel that goes to PyPI, so an unbounded
# specifier means the artifact for a given tag depends on whichever hatchling the
# index serves that day. Everything else on the publish path is version-pinned
# and hash-locked; this was the one link that was not.
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

# Scope the sdist explicitly. Without this section hatchling's default is
# "everything under packages/python that VCS does not ignore", which shipped all
# eleven test modules and .gitignore inside the tarball. Harmless -- the wheel is
# built from `packages` below, so an sdist install still installs no tests -- but
# the contents check in tools/clean_install_python.sh only ever opened the wheel,
# so nothing would have noticed something worse arriving the same way.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
# `.gitignore` still ships: hatchling includes it regardless of `include` and of
# an explicit `exclude`, which was measured rather than assumed. It is inert and
# shipping it is unremarkable -- recorded here so the next reader does not spend
# time on it, and so this comment does not claim a scope it does not have.

[tool.hatch.build.targets.wheel]
packages = ["src/xgboost_bridge"]
