[project]
name = "xgboost-bridge"
version = "0.1.0.dev0"
description = "Export trained XGBoost models as portable JSON artifacts, with a reference predictor."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Reading a fitted model requires XGBoost. Prediction and artifact inspection do not.
export = ["xgboost>=3.3,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xgboost_bridge"]
