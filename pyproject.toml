[project]
name = "xgboost-bridge-workspace"
version = "0.0.0"
description = "Workspace root. Not published."
# Development floor. xgboost 3.3.0 requires >=3.12, and the fixture corpus needs it.
# The published xgboost-bridge package has a lower floor; see packages/python.
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python", "fixtures"]

[tool.uv.sources]
xgboost-bridge = { workspace = true }
xgboost-bridge-fixtures = { workspace = true }

[dependency-groups]
dev = [
    "xgboost-bridge",
    "xgboost-bridge-fixtures",
    "pytest>=8.3",
    "jsonschema>=4.23",
    # High-precision reference for validating the bundled sigmoid/exp. Test-only;
    # never a runtime dependency of the published package. See D031.
    "mpmath>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests", "fixtures/tests"]
# importlib import mode: the two workspace members both have a `tests/` directory, so
# under the default "prepend" mode any shared test-file basename collides on the bare
# module name. importlib makes collection independent of basenames and needs no
# __init__.py marker files in test directories.
addopts = "-q --import-mode=importlib"
